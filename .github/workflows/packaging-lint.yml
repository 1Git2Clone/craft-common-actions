name: "Packaging lint"

on:
  workflow_call:
    inputs:
      actionlint-version:
        description: "Version of actionlint to install"
        type: string
        required: false
        default: "1.7.12"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run packaging lint
        uses: dylanmtaylor/artcraft-common-actions/actions/packaging-lint@main
        with:
          actionlint-version: ${{ inputs.actionlint-version }}

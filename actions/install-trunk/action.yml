name: "Install Trunk"
description: "Downloads and installs Trunk for WebAssembly packaging with SHA256 checksum verification"

inputs:
  trunk-version:
    description: "Version of Trunk to install"
    required: false
    default: "0.21.14"

runs:
  using: "composite"
  steps:
    - name: Install trunk
      shell: bash
      run: |
        tar_url="https://github.com/trunk-rs/trunk/releases/download/v${{ inputs.trunk-version }}/trunk-x86_64-unknown-linux-gnu.tar.gz"
        curl -fsSL -o "$RUNNER_TEMP/trunk.tar.gz" "$tar_url"
        case "${{ inputs.trunk-version }}" in
          "0.21.14")
            expected="f2b4680cd239693a646a2795e4633c625328d7b2a044fbe749fa3a2fe9e7036b"
            ;;
          *)
            curl -fsSL -o "$RUNNER_TEMP/trunk.sha256" "$tar_url.sha256"
            expected=$(awk '{print $1}' "$RUNNER_TEMP/trunk.sha256")
            ;;
        esac
        echo "$expected  $RUNNER_TEMP/trunk.tar.gz" | sha256sum -c -
        tar -xz -C "$HOME/.cargo/bin" -f "$RUNNER_TEMP/trunk.tar.gz" trunk
        trunk --version
